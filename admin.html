<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منابع | مهندسی انرژی شریف</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#07131d;--p:#0d202d;--line:#1d4252;--t:#eaf7fa;--m:#91aeb8;--a:#29d3c2;--d:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#123b4a,#07131d 48%,#050d14);color:var(--t);font-family:Vazirmatn,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:800}.brand span{color:var(--a)}a{color:inherit;text-decoration:none}.back{border:1px solid var(--line);padding:9px 13px;border-radius:10px}.panel{background:linear-gradient(180deg,#102632,#091923);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 25px 70px #0005}.panel h1{margin-top:0}.muted{color:var(--m)}label{display:block;font-size:13px;color:var(--m);margin:13px 0 6px}input,textarea,select{width:100%;background:#071720;color:var(--t);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}textarea{min-height:85px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;background:var(--a);color:#06201f;font:inherit;font-weight:800;padding:12px 16px;border-radius:11px;cursor:pointer;margin-top:16px}.danger{background:#3b1720;color:#ffb8c0;border:1px solid #672b37;padding:7px 10px;border-radius:8px}.hidden{display:none}.msg{margin-top:12px;color:var(--m);min-height:24px}.list{margin-top:24px;display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0a1b26;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:var(--m)}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.item{align-items:flex-start;flex-direction:column}}progress{width:100%;margin-top:10px}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">مهندسی انرژی <span>شریف</span></a><a class="back" href="notes.html">مشاهده منابع</a></header>
<section id="loginPanel" class="panel"><h1>ورود مدیر</h1><p class="muted">برای جلوگیری از لو رفتن رمز، احراز هویت توسط Supabase انجام می‌شود؛ رمز داخل کد سایت ذخیره نشده است.</p><label>نام کاربری / ایمیل</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="btn">ورود</button><div id="loginMsg" class="msg"></div></section>
<section id="adminPanel" class="panel hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>پنل انتشار جزوه</h1><p id="who" class="muted"></p></div><button id="logout" class="danger">خروج</button></div>
<label>عنوان فایل</label><input id="title" placeholder="مثلاً جزوه ترمودینامیک ۱"><div class="row"><div><label>درس</label><input id="course" placeholder="مثلاً ترمودینامیک ۱"></div><div><label>نوع</label><select id="type"><option>جزوه</option><option>تمرین</option><option>نمونه سؤال</option><option>حل تمرین</option><option>منبع</option><option>سایر</option></select></div></div><label>توضیحات</label><textarea id="description" placeholder="توضیح کوتاه درباره فایل"></textarea><label>فایل</label><input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.rar,.txt"><button id="upload" class="btn">آپلود و انتشار</button><progress id="progress" value="0" max="100" class="hidden"></progress><div id="msg" class="msg"></div><div id="list" class="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let sb;const $=id=>document.getElementById(id);function setup(){if(!window.supabase||SUPABASE_URL.includes('PASTE_')||SUPABASE_ANON_KEY.includes('PASTE_'))throw Error('Supabase هنوز تنظیم نشده است.');sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}
async function boot(){try{setup();const {data:{session}}=await sb.auth.getSession();session?showAdmin(session):showLogin();sb.auth.onAuthStateChange((_e,s)=>s?showAdmin(s):showLogin())}catch(e){$('loginMsg').textContent=e.message}}
function showLogin(){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden')}async function showAdmin(session){$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('who').textContent='وارد شده: '+session.user.email;loadNotes()}
$('login').onclick=async()=>{try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent='ورود ناموفق: '+e.message}}
$('logout').onclick=()=>sb.auth.signOut();
$('upload').onclick=async()=>{const file=$('file').files[0],title=$('title').value.trim(),course=$('course').value.trim();if(!file||!title||!course){$('msg').textContent='عنوان، درس و فایل را کامل کنید.';return}if(file.size>20*1024*1024){$('msg').textContent='حداکثر حجم فایل ۲۰ مگابایت است.';return}try{$('msg').textContent='در حال آپلود…';$('upload').disabled=true;$('progress').classList.remove('hidden');const path=`${crypto.randomUUID()}-${file.name.replace(/[^\w\-.\u0600-\u06ff ]/g,'_')}`;const up=await sb.storage.from('notes').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error)throw up.error;const {data:url}=sb.storage.from('notes').getPublicUrl(path);const ins=await sb.from('notes').insert({title,course,type:$('type').value,description:$('description').value.trim(),file_path:path,file_url:url.publicUrl,published:true}).select().single();if(ins.error)throw ins.error;$('msg').textContent='فایل با موفقیت منتشر شد.';$('title').value='';$('course').value='';$('description').value='';$('file').value='';$('progress').value=100;loadNotes()}catch(e){$('msg').textContent='خطا: '+e.message}finally{$('upload').disabled=false}}
async function loadNotes(){const {data,error}=await sb.from('notes').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="msg">'+error.message+'</div>';return}$('list').innerHTML=(data||[]).map(x=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.course)} · ${esc(x.type||'جزوه')}</small></div><button class="danger" onclick="delNote('${x.id}','${esc(x.file_path)}')">حذف</button></div>`).join('')||'<div class="msg">هنوز فایلی منتشر نشده.</div>'}
async function delNote(id,path){if(!confirm('این فایل حذف شود؟'))return;const a=await sb.storage.from('notes').remove([path]);if(a.error){$('msg').textContent=a.error.message;return}const d=await sb.from('notes').delete().eq('id',id);$('msg').textContent=d.error?d.error.message:'فایل حذف شد.';loadNotes()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}boot();
</script></body></html>
