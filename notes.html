<main id="main">
  <div class="wrap">
    <section class="page-head">
      <h1>جزوه‌ها و منابع درسی</h1>
      <p>جزوه، تمرین، نمونه‌سؤال و منابع منتخب دروس رشته. بر اساس نام یا درس جست‌وجو کن.</p>
    </section>
    <div class="tools two">
      <input id="search" type="search" placeholder="نام جزوه، درس یا توضیحات" aria-label="جست‌وجو">
      <select id="course" aria-label="فیلتر درس"><option value="">همهٔ درس‌ها</option></select>
    </div>
    <div id="status" class="status" role="status">در حال دریافت منابع…</div>
    <section id="grid" class="res-list" aria-live="polite"></section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>مهندسی انرژی شریف · دانشگاه صنعتی شریف</span>
    <nav aria-label="پیوندهای پایین صفحه">
      <a href="https://energy.sharif.ir" target="_blank" rel="noopener">وب‌گاه رسمی دانشکده</a>

    </nav>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),search=document.getElementById('search'),course=document.getElementById('course');function client(){if(!window.supabase||SUPABASE_URL.includes('PASTE_')||SUPABASE_ANON_KEY.includes('PASTE_'))throw new Error('Supabase هنوز تنظیم نشده است.');return supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}let all=[];
function render(){const q=search.value.trim().toLowerCase(),c=course.value;const rows=all.filter(x=>(!c||x.course===c)&&(!q||[x.title,x.course,x.description].join(' ').toLowerCase().includes(q)));if(!rows.length){grid.innerHTML='<div class="empty">منبعی با این جست‌وجو پیدا نشد.</div>';return}grid.innerHTML=rows.map(x=>`<article class="res"><div><span class="tag">${esc(x.type||'جزوه')}</span><h3>${esc(x.title)}</h3><div class="meta">درس: ${esc(x.course||'—')} · ${new Date(x.created_at).toLocaleDateString('fa-IR')}</div>${x.description?`<p class="desc">${esc(x.description)}</p>`:''}</div><a class="btn primary small" href="${esc(x.file_url)}" target="_blank" rel="noopener">مشاهده / دانلود</a></article>`).join('')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function load(){try{const sb=client();const {data,error}=await sb.from('notes').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;all=data||[];const courses=[...new Set(all.map(x=>x.course).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));course.innerHTML='<option value="">همه درس‌ها</option>'+courses.map(x=>`<option>${esc(x)}</option>`).join('');statusEl.textContent=`${all.length} منبع منتشر شده`;render()}catch(e){statusEl.textContent='خطا: '+e.message;grid.innerHTML='<div class="empty">اتصال به سامانه منابع هنوز تنظیم نشده است.</div>'}}
search.addEventListener('input',render);course.addEventListener('change',render);load();
</script></body>
</html>
