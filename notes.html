<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزوه‌ها و منابع | مهندسی انرژی شریف</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07131d;--panel:#0d202d;--panel2:#102a38;--line:#1d4252;--text:#eaf7fa;--muted:#91aeb8;--accent:#29d3c2;--accent2:#50a7ff;--danger:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#103746 0,#07131d 42%,#050d14 100%);color:var(--text);font-family:Vazirmatn,sans-serif;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:28px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}a{color:inherit;text-decoration:none}.back,.admin{border:1px solid var(--line);background:#0b1b27;padding:10px 15px;border-radius:12px}.hero{padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(20,57,71,.9),rgba(9,25,36,.92));box-shadow:0 20px 60px #0005;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:13px;font-weight:700}.hero h1{font-size:clamp(28px,5vw,48px);margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:800px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{background:#091923;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-family:inherit;min-width:180px}.tools input{flex:1}.status{color:var(--muted);font-size:14px;margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:linear-gradient(180deg,#102632,#0a1b26);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.2s;animation:up .35s ease both}.card:hover{transform:translateY(-3px);border-color:#2e7282}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#123844;color:#7ce9df;font-size:12px;margin-bottom:10px}.card h3{margin:0 0 7px;font-size:18px}.meta{font-size:13px;color:var(--muted);line-height:1.9}.download{display:inline-flex;margin-top:14px;background:var(--accent);color:#06201f;padding:9px 13px;border-radius:10px;font-weight:800}.empty{text-align:center;padding:50px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head><body><main class="wrap">
<header class="top"><a class="brand" href="index.html">مهندسی انرژی <span>شریف</span></a><div><a class="back" href="index.html">← صفحه اصلی</a> <a class="admin" href="admin.html">ورود مدیر</a></div></header>
<section class="hero"><div class="eyebrow">RESOURCE CENTER</div><h1>جزوه‌ها و منابع درسی</h1><p>جزوه‌ها، تمرین‌ها، نمونه‌سؤال‌ها و منابع منتخب رشته مهندسی انرژی. فایل‌های آموزشی منتخب برای دانشجویان رشته مهندسی انرژی.</p></section>
<div class="tools"><input id="search" placeholder="جست‌وجوی نام جزوه، درس یا توضیحات…"><select id="course"><option value="">همه درس‌ها</option></select></div><div id="status" class="status">در حال دریافت منابع…</div><section id="grid" class="grid"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),search=document.getElementById('search'),course=document.getElementById('course');
function client(){if(!window.supabase||SUPABASE_URL.includes('PASTE_')||SUPABASE_ANON_KEY.includes('PASTE_')) throw new Error('Supabase هنوز تنظیم نشده است.');return supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}
let all=[];
function render(){const q=search.value.trim().toLowerCase(), c=course.value; const rows=all.filter(x=>(!c||x.course===c)&&(!q||[x.title,x.course,x.description].join(' ').toLowerCase().includes(q))); if(!rows.length){grid.innerHTML='<div class="empty">هنوز منبع منتشرشده‌ای پیدا نشد.</div>';return} grid.innerHTML=rows.map(x=>`<article class="card"><span class="tag">${esc(x.type||'جزوه')}</span><h3>${esc(x.title)}</h3><div class="meta">درس: ${esc(x.course||'—')}<br>${esc(x.description||'')}<br>تاریخ انتشار: ${new Date(x.created_at).toLocaleDateString('fa-IR')}</div><a class="download" href="${esc(x.file_url)}" target="_blank" rel="noopener">مشاهده / دانلود</a></article>`).join('')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function load(){try{const sb=client();const {data,error}=await sb.from('notes').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;all=data||[];const courses=[...new Set(all.map(x=>x.course).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));course.innerHTML='<option value="">همه درس‌ها</option>'+courses.map(x=>`<option>${esc(x)}</option>`).join('');statusEl.textContent=`${all.length} منبع منتشر شده`;render()}catch(e){statusEl.textContent='خطا: '+e.message;grid.innerHTML='<div class="empty">اتصال به سامانه منابع هنوز تنظیم نشده است.</div>'}}
search.addEventListener('input',render);course.addEventListener('change',render);load();
</script></body></html>
